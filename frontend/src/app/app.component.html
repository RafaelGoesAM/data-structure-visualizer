    <main class="dashboard-content">
      <section class="controls-section">
        <app-controls></app-controls>
      </section>
  
      <div class="visualizer-grid">

        <section class="visualizer-card array-card">

          <app-array-bar></app-array-bar>

      </div>
    </main>
  </div>
