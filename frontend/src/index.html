<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Structure Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="app-container">
        <aside id="sidebar">
            <h2>Controls</h2>

            <div class="control-group">
                <label for="ds-selector">Data Structure:</label>
                <select id="ds-selector">
                    <option value="LINKED_LIST">Linked List</option>
                    <option value="QUEUE">Queue (FIFO)</option>
                    <option value="HEAP">Max Heap</option>
                </select>
            </div>
            <button id="preview-btn" class="btn-primary">Preview Structure</button>

            <hr>
            <div class="control-group">
                <label for="node-value">Value:</label>
                <input type="number" id="node-value" placeholder="e.g. 42" value="10" min="-999" max="999">
            </div>

            <button id="insert-btn" class="btn-primary">Insert Node</button>
            <button id="reset-btn" class="btn-primary">Reset View</button>

            <div class="status-box">
                Status: <span id="connection-status" class="disconnected">Disconnected</span>
            </div>
        </aside>

        <main id="visualizer-canvas">
            <div id="visualization-area"></div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
